name: Mirror Shopee PH from APKPure (via apkeep)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install apkeep
        run: |
          curl -L -o apkeep \
            https://github.com/EFForg/apkeep/releases/latest/download/apkeep-x86_64-unknown-linux-gnu
          chmod +x apkeep
          sudo mv apkeep /usr/local/bin/

      - name: Download Shopee PH from APKPure
        run: |
          mkdir -p out
          apkeep -a com.shopee.ph -d apk-pure out/
          ls -lh out/
          FILE=$(ls out/com.shopee.ph.* | head -1)
          echo "downloaded=$FILE"
          if [[ "$FILE" == *.xapk ]]; then
            unzip -o "$FILE" -d out/xapk
            # XAPKs put the main APK as base.apk or <pkg>.apk inside
            cp "$(ls out/xapk/base.apk out/xapk/com.shopee.ph.apk 2>/dev/null | head -1)" shopee.apk
          else
            cp "$FILE" shopee.apk
          fi
          ls -lh shopee.apk

      - name: Read versionName from APK
        id: ver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt
          VER=$(aapt dump badging shopee.apk | grep -oP "versionName='\K[^']+")
          CODE=$(aapt dump badging shopee.apk | grep -oP "versionCode='\K[^']+")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Detected Shopee version: $VER (code $CODE)"

      - name: Check if version already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="shopee-${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish versioned release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp shopee.apk "shopee-${{ steps.ver.outputs.version }}.apk"
          gh release create "shopee-${{ steps.ver.outputs.version }}" \
            --title "Shopee PH ${{ steps.ver.outputs.version }}" \
            --notes "Auto-mirrored from APKPure via apkeep. versionCode=${{ steps.ver.outputs.code }}." \
            "shopee-${{ steps.ver.outputs.version }}.apk"

      - name: Refresh stable "shopee-latest" pointer
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp shopee.apk shopee-latest.apk
          gh release delete shopee-latest --yes --cleanup-tag 2>/dev/null || true
          sleep 2
          gh release create shopee-latest \
            --title "Shopee PH (latest auto-mirror)" \
            --notes "Always points at the newest Shopee PH build. Currently ${{ steps.ver.outputs.version }}." \
            shopee-latest.apk
